<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authors | Quote Cloud</title>
  <script src="js/theme.js"></script>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium+Web:200,200italic,300,300italic,regular,italic,600,600italic,700,700italic,900&display=swap">
  <link rel="stylesheet" href="css/main.css">
  <script type="module" src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.js"></script>
  
</head>

<body>

  <header>

    <div class="logo">
      <img src="assets/images/logo.png" alt="">
      <h1>Quote Cloud</h1>
    </div>

    <nav>
      <a href="index.html" class="link">HOME</a>
      <a href="quote.html" class="link">QUOTES</a>
      <a href="tag.html" class="link">TAGS</a>
      <a href="author.html" class="link link-active" aria-current="page">AUTHORS</a>
      <a href="favorites.html" class="link nav-icon" aria-label="My favorites" title="My favorites">
        <ion-icon name="heart"></ion-icon>
      </a>
      <a href="my-quotes.html" class="link nav-icon" aria-label="My quotes" title="My quotes">
        <ion-icon name="create"></ion-icon>
      </a>
      <button class="theme-toggle nav-icon" aria-label="Switch theme"></button>
    </nav>

  </header>

  <section id="authors">
    <form class="search-form author-search page-search" role="search">
      <input type="search" placeholder="Search authors, e.g. Einstein" aria-label="Search authors">
      <button class="btn" aria-label="Search authors">
        <ion-icon name="search-circle"></ion-icon>
      </button>
    </form>

    <h2 class="title">AUTHORS</h2>

    <div class="filters" id="authorFilters">
      <div class="letter-bar" role="group" aria-label="Filter by first letter"></div>
      <label for="sortAuthors">Sort by:</label>
      <select id="sortAuthors">
        <option value="quotes">Most quotes</option>
        <option value="name">Name (A - Z)</option>
      </select>
    </div>

    <p class="result-count"></p>

    <div class="author-info"></div>

    <div class="author-list"></div>

    <div class="quotes-wrapper"></div>

    <div class="btn-group"></div>
  </section>

  <footer>
    <p class="copyright">&copy;ALL RIGHTS RESERVED <span class="year">2023</span></p>
    <p class="shortcut-hint">Press <kbd>?</kbd> for keyboard shortcuts</p>
  </footer>

  <script src="js/shared/settings.js"></script>
  <script src="js/shared/api.js"></script>
  <script src="js/shared/ui.js"></script>
  <script src="js/shared/favorites-store.js"></script>
  <script src="js/shared/wallpapers.js"></script>
  <script src="js/shared/quote-image.js"></script>
  <script src="js/shared/image-dialog.js"></script>
  <script src="js/shared/quote-card.js"></script>
  <script src="js/shared/pagination.js"></script>
  <script src="js/shared/layout.js"></script>
  <script src="js/pages/authors.js"></script>
</body>

</html>
