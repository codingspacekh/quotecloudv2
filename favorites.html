<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Favorites | Quote Cloud</title>
  <script src="js/theme.js"></script>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium+Web:200,200italic,300,300italic,regular,italic,600,600italic,700,700italic,900&display=swap">
  <link rel="stylesheet" href="css/main.css">
  <script type="module" src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.js"></script>
  
</head>

<body>

  <header>

    <div class="logo">
      <img src="assets/images/logo.png" alt="">
      <h1>Quote Cloud</h1>
    </div>

    <nav>
      <a href="index.html" class="link">HOME</a>
      <a href="quote.html" class="link">QUOTES</a>
      <a href="tag.html" class="link">TAGS</a>
      <a href="author.html" class="link">AUTHORS</a>
      <a href="favorites.html" class="link nav-icon link-active" aria-current="page" aria-label="My favorites" title="My favorites">
        <ion-icon name="heart"></ion-icon>
      </a>
      <a href="my-quotes.html" class="link nav-icon" aria-label="My quotes" title="My quotes">
        <ion-icon name="create"></ion-icon>
      </a>
      <button class="theme-toggle nav-icon" aria-label="Switch theme"></button>
    </nav>

  </header>

  <section id="favorites">
    <h2 class="title">MY FAVORITES</h2>

    <nav class="collection-bar" aria-label="Collections"></nav>
    <div class="collection-actions"></div>

    <div class="quotes-wrapper"></div>
  </section>

  <dialog class="dialog form-dialog" id="noteDialog" aria-labelledby="noteDialogTitle">
    <h3 id="noteDialogTitle">Your note</h3>
    <blockquote class="dialog-quote"></blockquote>
    <form>
      <label for="noteText">Why do you like this quote?</label>
      <textarea id="noteText" rows="4" maxlength="200" aria-describedby="noteCount"></textarea>
      <p class="char-count" id="noteCount"></p>
      <div class="dialog-buttons">
        <button type="button" class="btn delete-note-btn">Delete note</button>
        <button type="button" class="btn cancel-btn">Cancel</button>
        <button type="submit" class="btn primary-btn">Save</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog form-dialog" id="collectionsDialog" aria-labelledby="collectionsDialogTitle">
    <h3 id="collectionsDialogTitle">Add to collections</h3>
    <blockquote class="dialog-quote"></blockquote>
    <fieldset>
      <legend class="visually-hidden">Collections</legend>
      <div class="collection-checkboxes"></div>
    </fieldset>
    <form class="new-collection-form" novalidate>
      <label for="newCollectionName">New collection</label>
      <div class="inline-field">
        <input type="text" id="newCollectionName" maxlength="30" placeholder="e.g. Motivation" aria-describedby="newCollectionError">
        <button type="submit" class="btn">Add</button>
      </div>
      <p class="field-error" id="newCollectionError" role="alert"></p>
    </form>
    <div class="dialog-buttons">
      <button type="button" class="btn primary-btn done-btn">Done</button>
    </div>
  </dialog>

  <dialog class="dialog form-dialog" id="collectionNameDialog" aria-labelledby="collectionNameTitle">
    <h3 id="collectionNameTitle">New collection</h3>
    <form novalidate>
      <label for="collectionName">Name</label>
      <input type="text" id="collectionName" maxlength="30" placeholder="e.g. For exams" aria-describedby="collectionNameError">
      <p class="field-error" id="collectionNameError" role="alert"></p>
      <div class="dialog-buttons">
        <button type="button" class="btn cancel-btn">Cancel</button>
        <button type="submit" class="btn primary-btn">Save</button>
      </div>
    </form>
  </dialog>

  <footer>
    <p class="copyright">&copy;ALL RIGHTS RESERVED <span class="year">2023</span></p>
    <p class="shortcut-hint">Press <kbd>?</kbd> for keyboard shortcuts</p>
  </footer>

  <script src="js/shared/settings.js"></script>
  <script src="js/shared/api.js"></script>
  <script src="js/shared/ui.js"></script>
  <script src="js/shared/favorites-store.js"></script>
  <script src="js/shared/quote-image.js"></script>
  <script src="js/shared/image-dialog.js"></script>
  <script src="js/shared/quote-card.js"></script>
  <script src="js/shared/pagination.js"></script>
  <script src="js/shared/layout.js"></script>
  <script src="js/pages/favorites.js"></script>
</body>

</html>
