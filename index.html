<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Cloud</title>
  <script src="js/theme.js"></script>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/images/logo.png">
  <link rel="stylesheet" href="css/main.css">
  <script type="module" src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.js"></script>

</head>

<body>

  <header>

    <div class="logo">
      <img src="assets/images/logo.png" alt="">
      <h1>Quote Cloud</h1>
    </div>

    <nav>
      <a href="index.html" class="link link-active">HOME</a>
      <a href="quote.html" class="link">QUOTES</a>
      <a href="tag.html" class="link">TAGS</a>
      <a href="author.html" class="link">AUTHORS</a>
      <a href="favorites.html" class="link nav-icon" aria-label="My favorites" title="My favorites">
        <ion-icon name="heart"></ion-icon>
      </a>
      <button class="theme-toggle nav-icon" aria-label="Switch theme"></button>
    </nav>

  </header>

  <div class="banner">
    <form id="searchForm" class="search-form" role="search">
      <input type="search" id="searchTerm" placeholder="Search quotes, e.g. love, life, success" aria-label="Search quotes">
      <button class="btn" id="submitBtn" aria-label="Search">
        <ion-icon name="search-circle"></ion-icon>
      </button>
    </form>
  </div>


  <section id="today-quote">
    <h2 class="title">QUOTE OF THE DAY</h2>

    <div class="today-quote-wrapper"></div>
    <button class="btn" id="randomQuoteBtn">Get Another Quote</button>
  </section>

  <section id="famous-quote">
    <h2 class="title">FAMOUS QUOTES</h2>

    <div class="quotes-wrapper"></div>


  </section>


  <footer>
    <h4>&copy;ALL RIGHTS RESERVED <span class="year">2023</span></h4>
    <p class="shortcut-hint">Press <kbd>?</kbd> for keyboard shortcuts</p>
  </footer>

  <!-- shared code first, the page's own script last -->
  <script src="js/shared/settings.js"></script>
  <script src="js/shared/api.js"></script>
  <script src="js/shared/ui.js"></script>
  <script src="js/shared/favorites-store.js"></script>
  <script src="js/shared/quote-image.js"></script>
  <script src="js/shared/quote-card.js"></script>
  <script src="js/shared/pagination.js"></script>
  <script src="js/shared/layout.js"></script>
  <script src="js/pages/home.js"></script>
</body>

</html>
